<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ICPC Live Board (CDS Powered)</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-color: #161b22;
            --text-color: #c9d1d9;
            --accent-color: #58a6ff;
            --ac-color: #2ea44f;
            --wa-color: #da3633;
            --pending-color: #d29922;
            --border-color: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Courier New", monospace;
            overflow: hidden; display: flex; flex-direction: column; height: 100vh; padding: 10px;
        }

        /* --- 配置面板 --- */
        #config-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: var(--panel-color); padding: 30px; border: 1px solid var(--border-color);
            border-radius: 12px; z-index: 1000; display: flex; flex-direction: column; gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8); width: 450px;
        }
        #config-panel h2 { text-align: center; color: white; margin-bottom: 5px; }
        #config-panel .hint { text-align: center; color: #8b949e; font-size: 12px; margin-bottom: 10px;}
        #config-panel input, #config-panel button {
            background: #21262d; border: 1px solid var(--border-color); color: white;
            padding: 10px 15px; border-radius: 6px; font-size: 14px; width: 100%;
        }
        #config-panel input:focus { border-color: var(--accent-color); outline: none; }
        #config-panel button { background: var(--accent-color); color: #0d1117; font-weight: bold; cursor: pointer; font-size: 16px;}
        #config-panel button:hover { opacity: 0.9; }

        #nav-hint { position: absolute; bottom: 10px; left: 10px; color: #8b949e; font-size: 12px; z-index: 100; }

        /* --- 视图通用 --- */
        .view { display: none; flex: 1; flex-direction: column; overflow: hidden; }
        .view.active { display: flex; }

        /* --- 倒计时视图 --- */
        #view-countdown { justify-content: center; align-items: center; text-align: center; }
        .contest-big-title { font-size: 3vw; color: #8b949e; margin-bottom: 20px; }
        .clock-display { font-size: 18vw; font-weight: bold; color: white; text-shadow: 0 0 40px rgba(88, 166, 255, 0.4); font-variant-numeric: tabular-nums; }

        /* --- 评测队列视图 --- */
        #queue-container { flex: 1; overflow-y: hidden; background: var(--panel-color); border-radius: 8px; border: 1px solid var(--border-color); padding: 10px; }
        .queue-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; margin-bottom: 8px; background: rgba(255,255,255,0.03);
            border-radius: 6px; font-size: 24px; animation: slideIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: background-color 0.3s;
        }
        .q-time { color: #8b949e; font-size: 18px; width: 120px; }
        .q-team { font-weight: bold; color: white; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .q-prob { width: 150px; text-align: center; color: var(--accent-color); font-weight: bold; }
        .q-verdict { width: 200px; text-align: right; font-weight: bold; font-size: 28px; transition: color 0.3s, text-shadow 0.3s;}
        
        .v-AC { color: var(--ac-color); text-shadow: 0 0 15px var(--ac-color); animation: flash-ac-bg 2s; }
        .v-WA, .v-TLE, .v-MLE, .v-RE, .v-CE { color: var(--wa-color); }
        .v-PENDING { color: var(--pending-color); animation: blink 1.5s infinite; }

        @keyframes slideIn { from { opacity: 0; transform: translateX(-50px); } to { opacity: 1; transform: translateX(0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        @keyframes flash-ac-bg { 0%, 50% { background-color: rgba(46, 164, 79, 0.3); } 100% { background-color: rgba(255,255,255,0.03); } }

        /* --- 榜单视图 --- */
        #header-stats {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--panel-color); border: 1px solid var(--border-color);
            padding: 15px 25px; border-radius: 8px 8px 0 0;
        }
        .contest-title { font-size: 24px; font-weight: bold; color: white; }
        #table-container {
            flex: 1; overflow-y: auto; background: var(--panel-color);
            border: 1px solid var(--border-color); border-top: none; border-radius: 0 0 8px 8px;
        }
        #table-container::-webkit-scrollbar { display: none; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 16px; }
        th { position: sticky; top: 0; background: #21262d; z-index: 10; padding: 12px; border-bottom: 2px solid var(--border-color); color: #8b949e; text-align: center;}
        th:nth-child(2) { text-align: left; } /* Team列左对齐 */
        td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); vertical-align: middle; text-align: center; }
        td:nth-child(2) { text-align: left; }
        tr:nth-child(even) { background-color: rgba(255,255,255,0.01); }
        
        .rank { font-weight: bold; font-size: 18px; }
        .team-name { font-weight: 600; color: white; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .solved { font-weight: bold; color: #56d364; font-size: 18px; }
        .penalty { color: #8b949e; }
        
        /* 题目单元格网格样式 */
        td.td-prob { font-size: 14px; font-weight: bold; border-left: 1px solid #21262d;}
        td.prob-ac { background-color: var(--ac-color); color: white; }
        td.prob-wa { background-color: var(--wa-color); color: white; }
        td.prob-pending { background-color: var(--pending-color); color: white; }
    </style>
</head>
<body>

    <div id="config-panel">
        <h2>CDS API Connector</h2>
        <div class="hint">通过 ICPC Tools Contest Data Server 获取数据</div>
        <input type="text" id="api-base" placeholder="CDS Base URL (e.g. https://192.168.1.11:8443/api)">
        <input type="text" id="contest-id" placeholder="CDS Contest ID (e.g. 123)">
        <input type="text" id="username" placeholder="CDS Username (e.g. admin)">
        <input type="password" id="password" placeholder="CDS Password (e.g. admin)">
        <button onclick="startDashboard()">连接 CDS 启动看板</button>
    </div>

    <div id="nav-hint" style="display:none;">快捷键：[1] 倒计时屏 | [2] 实时评测队列 | [3] 计分板滚动</div>

    <div id="view-1" class="view">
        <div class="contest-big-title" id="cd-title">Loading Contest...</div>
        <div class="clock-display" id="cd-clock">00:00:00</div>
    </div>

    <div id="view-2" class="view">
        <div id="header-stats" style="border-radius: 8px; margin-bottom: 10px;">
            <div class="contest-title">Live Judgements Queue</div>
        </div>
        <div id="queue-container"></div> 
    </div>

    <div id="view-3" class="view">
        <div id="header-stats">
            <div class="contest-title" id="sb-title">Scoreboard</div>
            <div style="display:flex; align-items:center; gap: 15px;">
                <span style="font-size: 14px; color: #8b949e;">AC Trend:</span>
                <canvas id="trend-chart" width="300" height="50"></canvas>
            </div>
        </div>
        <div id="table-container">
            <table>
                <thead id="sb-head">
                    </thead>
                <tbody id="scoreboard-body"></tbody>
            </table>
        </div>
    </div>

<script>
    let config = { base: '', cid: '', auth: '' };
    let cache = { teams: {}, problems: {}, meta: null };
    let problemKeys = []; // 存题号数组 [A, B, C...]
    let renderedQueue = {}; // 存已经渲染的提交：{ subId: { verdict: '...', domNode: Node } }
    
    let pollInterval, scrollInterval;
    let scrollDirection = 1;

    window.onload = () => {
        const saved = localStorage.getItem('cds-board-config');
        if (saved) {
            const c = JSON.parse(saved);
            document.getElementById('api-base').value = c.base || 'https://192.168.1.11:8443/api';
            document.getElementById('contest-id').value = c.cid || '123';
            document.getElementById('username').value = c.user || 'admin';
            document.getElementById('password').value = c.pass || 'admin';
        }
        document.addEventListener('keydown', (e) => {
            if(e.key === '1') switchView(1);
            if(e.key === '2') switchView(2);
            if(e.key === '3') switchView(3);
        });
    };

    function switchView(id) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById(`view-${id}`).classList.add('active');
    }

    async function startDashboard() {
        const base = document.getElementById('api-base').value.trim().replace(/\/$/, "");
        const cid = document.getElementById('contest-id').value.trim();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();

        if (!base || !cid) return alert('API URL 和 Contest ID 是必填项！');

        config = { base, cid, user, pass };
        if (user && pass) config.auth = 'Basic ' + btoa(`${user}:${pass}`);
        
        localStorage.setItem('cds-board-config', JSON.stringify(config));
        document.getElementById('config-panel').style.display = 'none';
        document.getElementById('nav-hint').style.display = 'block';
        
        switchView(2); 
        await initMeta();
        pollData();
        pollInterval = setInterval(pollData, 3000); 
        startAutoScroll();
    }

    async function fetchCDS(endpoint) {
        try {
            const headers = {};
            if (config.auth) headers['Authorization'] = config.auth;
            const res = await fetch(`${config.base}/contests/${config.cid}${endpoint}`, { headers });
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            return await res.json();
        } catch (e) {
            console.error(`Failed: ${endpoint}`, e);
            return null;
        }
    }

    // 1. 初始化拉取元数据 (动态生成表头)
    async function initMeta() {
        const [teams, probs, meta] = await Promise.all([
            fetchCDS('/teams'), fetchCDS('/problems'), fetchCDS('')
        ]);
        
        if (teams) teams.forEach(t => cache.teams[t.id] = t.display_name || t.name || t.label || `Team ${t.id}`);
        
        if (probs) {
            // 将题目按顺序排好 (A, B, C...)
            probs.sort((a,b) => (a.ordinal||0) - (b.ordinal||0) || (a.label||'').localeCompare(b.label||''));
            let theadHtml = `<tr><th class="rank" style="width:60px">Rnk</th><th>Team</th><th class="solved" style="width:60px">Slv</th><th class="penalty" style="width:80px">Pen</th>`;
            probs.forEach(p => {
                problemKeys.push(p.id);
                cache.problems[p.id] = p.label || p.name;
                theadHtml += `<th style="width:60px">${cache.problems[p.id]}</th>`;
            });
            theadHtml += `</tr>`;
            document.getElementById('sb-head').innerHTML = theadHtml;
        }
        
        if (meta) {
            cache.meta = meta;
            document.getElementById('cd-title').innerText = meta.formal_name || meta.name;
            document.getElementById('sb-title').innerText = meta.name;
        }
    }

    async function pollData() {
        updateClock();
        updateScoreboard();
        updateQueue(); 
    }

    async function updateClock() {
        const state = await fetchCDS('/state');
        if (!state || !state.started || !cache.meta) return;
        
        const startTime = new Date(state.started).getTime();
        const now = new Date().getTime();
        
        const p = cache.meta.duration.split(':');
        const durationMs = (+p[0]*3600 + +p[1]*60 + (+p[2]||0)) * 1000;
        const endTime = startTime + durationMs;
        const left = Math.max(0, endTime - now);
        
        let h = Math.floor(left / 3600000);
        let m = Math.floor((left % 3600000) / 60000);
        let s = Math.floor((left % 60000) / 1000);
        
        document.getElementById('cd-clock').innerText = 
            `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
    }

    // 2. 榜单更新逻辑 (动态匹配所有题目格子)
    async function updateScoreboard() {
        const sb = await fetchCDS('/scoreboard');
        if (!sb || !sb.rows) return;
        
        const tbody = document.getElementById('scoreboard-body');
        let html = '';
        
        sb.rows.sort((a, b) => a.rank - b.rank);
        renderChart(sb.rows);

        sb.rows.forEach(row => {
            const teamName = cache.teams[row.team_id] || `Team ${row.team_id}`;
            
            // 查字典映射题目进度
            let pMap = {};
            if(row.problems) row.problems.forEach(p => pMap[p.problem_id] = p);

            let probsHtml = '';
            problemKeys.forEach(pid => {
                const p = pMap[pid];
                let cellClass = 'td-prob';
                let text = '';
                
                if (p) {
                    if (p.solved) { cellClass += ' prob-ac'; text = `+${p.num_judged - 1 || ''} <br><span style="font-size:10px;font-weight:normal">${p.time||''}m</span>`; }
                    else if (p.num_pending > 0) { cellClass += ' prob-pending'; text = `?`; }
                    else if (p.num_judged > 0) { cellClass += ' prob-wa'; text = `-${p.num_judged}`; }
                }
                probsHtml += `<td class="${cellClass}">${text}</td>`;
            });

            html += `<tr>
                <td class="rank">${row.rank}</td>
                <td class="team-name">${teamName}</td>
                <td class="solved">${row.score.num_solved}</td>
                <td class="penalty">${Math.floor(row.score.total_time)}</td>
                ${probsHtml}
            </tr>`;
        });
        tbody.innerHTML = html;
    }

    function renderChart(rows) {
        const canvas = document.getElementById('trend-chart');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const dist = {};
        rows.forEach(r => dist[r.score.num_solved] = (dist[r.score.num_solved] || 0) + 1);
        const keys = Object.keys(dist).map(Number).sort((a,b)=>a-b);
        if (keys.length === 0) return;

        const maxTeams = Math.max(...Object.values(dist));
        const barWidth = canvas.width / (keys.length + 2);
        
        ctx.fillStyle = '#58a6ff';
        keys.forEach((key, index) => {
            const count = dist[key];
            const barHeight = (count / maxTeams) * (canvas.height - 10);
            const x = (index + 1) * barWidth;
            const y = canvas.height - barHeight;
            ctx.fillRect(x, y, barWidth - 4, barHeight);
        });
    }

    // 3. 瀑布流评测队列 (DOM增量更新，防抖动！)
    async function updateQueue() {
        const submissions = await fetchCDS('/submissions');
        const judgements = await fetchCDS('/judgements');
        if (!submissions) return;

        let jMap = {};
        if (judgements) {
            judgements.forEach(j => {
                if(!jMap[j.submission_id] || j.end_time) jMap[j.submission_id] = j;
            });
        }

        // 把最新的提交排在前面（按时间降序），取最近的 15 条
        const latest = submissions.sort((a, b) => new Date(b.time) - new Date(a.time)).slice(0, 15);
        // 反转为时间升序，这样遍历插入 DOM 时，最老的最先插在顶部，最新的最后插在顶部，最终最新的就在最上面。
        const toRender = latest.reverse(); 

        const container = document.getElementById('queue-container');

        toRender.forEach(sub => {
            const j = jMap[sub.id];
            let verdict = 'PENDING';
            let vClass = 'v-PENDING';
            if (j && j.judgement_type_id) {
                verdict = j.judgement_type_id; 
                vClass = 'v-' + verdict;
            }

            // 如果这条记录之前没渲染过，直接从顶部插入新节点（触发 CSS slideIn 动画）
            if (!renderedQueue[sub.id]) {
                const timeStr = new Date(sub.time).toLocaleTimeString('en-US', {hour12:false});
                const teamName = cache.teams[sub.team_id] || `Team ${sub.team_id}`;
                const probLabel = cache.problems[sub.problem_id] || `P-${sub.problem_id}`;

                const el = document.createElement('div');
                el.className = `queue-item`;
                el.innerHTML = `
                    <div class="q-time">${timeStr}</div>
                    <div class="q-team">${teamName}</div>
                    <div class="q-prob">Problem ${probLabel}</div>
                    <div class="q-verdict ${vClass}">${verdict}</div>
                `;
                container.insertBefore(el, container.firstChild);
                renderedQueue[sub.id] = { verdict: verdict, domNode: el };
            } 
            // 如果渲染过，但是状态变了（比如从 PENDING 变成了 AC），只更新文字和颜色！
            else if (renderedQueue[sub.id].verdict !== verdict) {
                renderedQueue[sub.id].verdict = verdict;
                const vNode = renderedQueue[sub.id].domNode.querySelector('.q-verdict');
                vNode.className = `q-verdict ${vClass}`;
                vNode.innerText = verdict;
            }
        });

        // 保持页面元素干净，超过 15 个的把最底下的（老的）删掉
        while (container.children.length > 15) {
            const lastId = Object.keys(renderedQueue).find(key => renderedQueue[key].domNode === container.lastChild);
            if(lastId) delete renderedQueue[lastId];
            container.removeChild(container.lastChild);
        }
    }

    // 计分板平滑滚动
    function startAutoScroll() {
        const container = document.getElementById('table-container');
        scrollInterval = setInterval(() => {
            if(!document.getElementById('view-3').classList.contains('active')) return;
            
            const maxScroll = container.scrollHeight - container.clientHeight;
            if (maxScroll <= 0) return;

            if (container.scrollTop >= maxScroll - 1 && scrollDirection === 1) scrollDirection = -1;
            else if (container.scrollTop <= 0 && scrollDirection === -1) scrollDirection = 1;
            
            container.scrollTop += (scrollDirection === 1 ? 1 : -5); 
        }, 40);
    }
</script>
</body>
</html>
